name: Python CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Temporary test:
      # Only checks that the Streamlit app starts.
      # No Gemini/API query testing.
      - name: Validate Streamlit app
        run: |
          python -m py_compile *.py


      # Runs only when a version tag is pushed
      - name: Trigger CD
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CD_REPO_TOKEN }}
          repository: Deepak1125/Knowledge-base-Search-Engine-deploy
          event-type: deploy
          client-payload: |
            {
              "tag": "${{ github.ref_name }}"
            }